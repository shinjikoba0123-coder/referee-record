<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111827'><link rel='manifest' href='manifest.webmanifest'><title>審判記録</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f5f7;color:#111}main{max-width:620px;margin:auto;padding:16px}.card{background:white;border-radius:18px;padding:16px;margin-bottom:14px}h1{font-size:22px}.clock{text-align:center;font-size:56px;font-weight:800;font-variant-numeric:tabular-nums}.row{display:flex;gap:10px}.row>*{flex:1}button,input,select{font:inherit;min-height:48px;border-radius:12px;border:1px solid #ccc;padding:8px;box-sizing:border-box}button{background:white;font-weight:700}.primary{background:#111827;color:white}.goal{min-height:90px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.num{min-height:50px}.hidden{display:none}.event{padding:10px;border-bottom:1px solid #eee}.score{text-align:center;font-size:28px;font-weight:800}.muted{color:#666;font-size:13px}.danger{color:#b91c1c}label{font-size:12px;color:#555}input,select{width:100%;background:white}</style></head><body><main><h1>⚽ サッカー審判記録</h1><div class='card row'><div><label>チームA</label><input id='na' value='チームA'></div><div><label>チームB</label><input id='nb' value='チームB'></div><div><label>時間</label><select id='dur'><option>20</option><option>25</option><option>30</option><option>35</option><option>40</option><option selected>45</option></select></div></div><div class='card'><div id='half' style='text-align:center;font-weight:700'>前半</div><div id='clock' class='clock'>00:00</div><div class='row'><button id='start' class='primary'>▶ 開始</button><button id='pause'>⏸ 停止</button><button id='next'>後半へ</button></div></div><div class='card'><div id='score' class='score'>0 − 0</div><div class='row'><button id='ga' class='goal'>チームA<br>⚽ ゴール</button><button id='gb' class='goal'>チームB<br>⚽ ゴール</button></div><div class='row' style='margin-top:10px'><button id='ca'>A 🟨🟥</button><button id='cb'>B 🟨🟥</button></div></div><div id='pick' class='card hidden'><b id='pt'></b><div id='nums' class='grid' style='margin-top:10px'></div><button id='unk' style='width:100%;margin-top:10px'>背番号不明</button></div><div id='cards' class='card hidden'><div class='row'><button id='yellow'>🟨 イエロー</button><button id='red'>🟥 レッド</button></div></div><div class='card'><b>試合記録</b><div id='log' style='margin-top:8px'></div><div class='row' style='margin-top:12px'><button id='undo'>↩ 取消</button><button id='finish' class='primary'>🏁 試合終了</button></div></div><div id='summary' class='card hidden'></div><div class='card'><button id='new' class='danger' style='width:100%'>新しい試合</button><div class='muted' style='margin-top:8px'>入力内容はこの端末に自動保存されます。オフラインでも利用できます。</div></div></main><script>
const $=x=>document.getElementById(x);let st=JSON.parse(localStorage.getItem('refstate')||'null')||{elapsed:0,running:false,half:1,events:[],na:'チームA',nb:'チームB',dur:'45'};let last=Date.now(),pending=null;st.running=false;function save(){st.na=$('na').value;st.nb=$('nb').value;st.dur=$('dur').value;localStorage.setItem('refstate',JSON.stringify(st))}function cur(){return st.running?st.elapsed+Math.floor((Date.now()-last)/1000):st.elapsed}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function names(t){return t==='A'?$('na').value:$('nb').value}function render(){ $('clock').textContent=fmt(cur());$('half').textContent=st.half===1?'前半':'後半';$('next').textContent=st.half===1?'後半へ':'前半へ';$('ga').innerHTML=names('A')+'<br>⚽ ゴール';$('gb').innerHTML=names('B')+'<br>⚽ ゴール';let a=st.events.filter(e=>e.kind==='goal'&&e.team==='A').length,b=st.events.filter(e=>e.kind==='goal'&&e.team==='B').length;$('score').textContent=a+' − '+b;$('log').innerHTML='';st.events.forEach(e=>{let d=document.createElement('div');d.className='event';let icon=e.kind==='goal'?'⚽':e.card==='yellow'?'🟨':'🟥';d.textContent=icon+' '+(e.half===1?'前半':'後半')+' '+(Math.floor(e.sec/60)+1)+'分　'+names(e.team)+'　#'+e.player;$('log').appendChild(d)});save()}function pick(team,kind){pending={team,kind,sec:cur(),half:st.half};$('pt').textContent=names(team)+'：'+(kind==='goal'?'得点者':'対象選手')+'の背番号';$('pick').classList.remove('hidden');$('cards').classList.add('hidden')}function number(n){pending.player=n;$('pick').classList.add('hidden');if(pending.kind==='goal'){st.events.push(pending);pending=null;render()}else $('cards').classList.remove('hidden')}function card(c){pending.card=c;st.events.push(pending);pending=null;$('cards').classList.add('hidden');render()}for(let i=1;i<=30;i++){let b=document.createElement('button');b.className='num';b.textContent=i;b.onclick=()=>number(i);$('nums').appendChild(b)}$('unk').onclick=()=>number('?');$('start').onclick=()=>{if(!st.running){st.running=true;last=Date.now();render()}};$('pause').onclick=()=>{if(st.running){st.elapsed=cur();st.running=false;render()}};$('next').onclick=()=>{$('pause').click();st.half=st.half===1?2:1;st.elapsed=0;render()};$('ga').onclick=()=>pick('A','goal');$('gb').onclick=()=>pick('B','goal');$('ca').onclick=()=>pick('A','card');$('cb').onclick=()=>pick('B','card');$('yellow').onclick=()=>card('yellow');$('red').onclick=()=>card('red');$('undo').onclick=()=>{st.events.pop();render()};$('finish').onclick=()=>{$('pause').click();let a=st.events.filter(e=>e.kind==='goal'&&e.team==='A').length,b=st.events.filter(e=>e.kind==='goal'&&e.team==='B').length;$('summary').innerHTML='<h2>試合終了</h2><div class="score">'+$('na').value+' '+a+' − '+b+' '+$('nb').value+'</div><p class="muted">記録は上の「試合記録」に保存されています。</p>';$('summary').classList.remove('hidden')};$('new').onclick=()=>{if(confirm('現在の試合をリセットしますか？')){st={elapsed:0,running:false,half:1,events:[],na:'チームA',nb:'チームB',dur:'45'};$('na').value=st.na;$('nb').value=st.nb;$('dur').value=st.dur;$('summary').classList.add('hidden');render()}};['na','nb','dur'].forEach(x=>$(x).oninput=render);$('na').value=st.na;$('nb').value=st.nb;$('dur').value=st.dur;setInterval(()=>{if(st.running)render()},500);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
