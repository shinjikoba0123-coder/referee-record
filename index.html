<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111827'><link rel='manifest' href='manifest.webmanifest'><title>審判記録</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f5f7;color:#111}main{max-width:620px;margin:auto;padding:16px}.card{background:white;border-radius:18px;padding:16px;margin-bottom:14px}h1{font-size:22px}.clock{text-align:center;font-size:56px;font-weight:800;font-variant-numeric:tabular-nums}.row{display:flex;gap:10px}.row>*{flex:1}button,input,select{font:inherit;min-height:48px;border-radius:12px;border:1px solid #ccc;padding:8px;box-sizing:border-box}button{background:white;font-weight:700}.primary{background:#111827;color:white}.goal{min-height:90px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.num{min-height:50px}.hidden{display:none}.event{padding:10px;border-bottom:1px solid #eee}.score{text-align:center;font-size:28px;font-weight:800}.muted{color:#666;font-size:13px}.danger{color:#b91c1c}.teamcol{display:flex;flex-direction:column;gap:9px;min-width:0}.teamcol .goal{min-height:64px}.teamcol button{width:100%}.yellowbtn{background:#facc15;color:#171717}.redbtn{background:#dc2626;color:white}.teamhead{text-align:center;font-weight:700;overflow-wrap:anywhere}.teamscore{text-align:center;font-size:34px;font-weight:800}.scorerrow{display:flex;justify-content:space-between;gap:8px;padding:5px 0}.summaryteams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summaryteams>div{min-width:0}.summaryteams h3{overflow-wrap:anywhere;font-size:15px}label{font-size:12px;color:#555}input,select{width:100%;background:white}</style></head><body><main><h1>⚽ サッカー審判記録</h1><div class='card'><label>試合時間（前後半それぞれ）</label><select id='dur'><option>10</option><option>15</option><option>20</option><option>25</option><option>30</option><option>35</option><option>40</option><option selected>45</option></select></div><div class='card row'><div><label>左側のチーム</label><input id='na' value='チームA'></div><div><label>右側のチーム</label><input id='nb' value='チームB'></div></div><div class='card'><b>前半のキックオフ</b><div class='row' style='margin-top:10px'><button id='kickA' type='button'>チームA</button><button id='kickB' type='button'>チームB</button></div><div class='muted' style='margin-top:8px'>キックオフしたチームを選択してください</div></div><div class='card'><div id='half' style='text-align:center;font-weight:700'>前半</div><div id='clock' class='clock'>00:00</div><div class='row'><button id='start' class='primary'>▶ 開始</button><button id='pause'>⏸ 停止</button><button id='next'>後半へ</button></div></div><div class='card'><div class='row'><div class='teamcol'><div class='teamhead' id='headA'>チームA</div><div class='teamscore' id='scoreA'>0</div><button id='ga' class='goal'>⚽ ゴール</button><button id='ya' class='yellowbtn'>🟨 イエロー</button><button id='ra' class='redbtn'>🟥 レッド</button></div><div class='teamcol'><div class='teamhead' id='headB'>チームB</div><div class='teamscore' id='scoreB'>0</div><button id='gb' class='goal'>⚽ ゴール</button><button id='yb' class='yellowbtn'>🟨 イエロー</button><button id='rb' class='redbtn'>🟥 レッド</button></div></div></div><div id='pick' class='card hidden'><b id='pt'></b><div id='digitstep' class='muted' style='margin-top:8px'>十の位を選択（1桁は0）</div><div id='nums' class='grid' style='margin-top:10px'></div><button id='backdigit' class='hidden' style='width:100%;margin-top:10px'>← 十の位を選び直す</button><button id='unk' style='width:100%;margin-top:10px'>背番号不明</button></div><div class='card'><b>試合記録</b><div id='log' style='margin-top:8px'></div><div class='row' style='margin-top:12px'><button id='undo'>↩ 取消</button><button id='finish' class='primary'>🏁 試合終了</button></div></div><div id='summary' class='card hidden'></div><div class='card'><button id='new' class='danger' style='width:100%'>新しい試合</button></div></main><script>
const $=x=>document.getElementById(x);let st=JSON.parse(localStorage.getItem('refstate')||'null')||{elapsed:0,running:false,half:1,events:[],na:'チームA',nb:'チームB',dur:'45',kickoff:null};let last=Date.now(),pending=null,tens=null;st.running=false;function save(){st.na=$('na').value;st.nb=$('nb').value;st.dur=$('dur').value;localStorage.setItem('refstate',JSON.stringify(st))}function cur(){return st.running?st.elapsed+Math.floor((Date.now()-last)/1000):st.elapsed}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function names(t){return t==='A'?$('na').value:$('nb').value}function render(){ $('kickA').textContent=names('A')+(st.kickoff==='A'?' ✓':'');$('kickB').textContent=names('B')+(st.kickoff==='B'?' ✓':'');$('kickA').style.background=st.kickoff==='A'?'#dbeafe':'white';$('kickB').style.background=st.kickoff==='B'?'#dbeafe':'white';$('kickA').setAttribute('aria-pressed',st.kickoff==='A');$('kickB').setAttribute('aria-pressed',st.kickoff==='B'); $('clock').textContent=fmt(cur());$('half').textContent=st.half===1?'前半':'後半';$('next').textContent=st.half===1?'後半へ':'前半へ';$('headA').textContent=names('A');$('headB').textContent=names('B');let a=st.events.filter(e=>e.kind==='goal'&&e.team==='A').length,b=st.events.filter(e=>e.kind==='goal'&&e.team==='B').length;$('scoreA').textContent=a;$('scoreB').textContent=b;$('log').innerHTML='';st.events.forEach(e=>{let d=document.createElement('div');d.className='event';let icon=e.kind==='goal'?'⚽':e.card==='yellow'?'🟨':'🟥';d.textContent=icon+' '+(e.half===1?'前半':'後半')+' '+(Math.floor(e.sec/60)+1)+'分　'+names(e.team)+'　#'+e.player;$('log').appendChild(d)});save()}function drawDigits(){let box=$('nums');box.innerHTML='';$('digitstep').textContent=tens===null?'十の位を選択（1桁は0）':'一の位を選択　#'+tens+'＿';$('backdigit').classList.toggle('hidden',tens===null);for(let i=0;i<=9;i++){let b=document.createElement('button');b.className='num';b.textContent=i;b.onclick=()=>{if(tens===null){tens=i;drawDigits()}else{let n=tens*10+i;if(n===0){alert('背番号00は選べません');tens=null;drawDigits();return}number(n)}};box.appendChild(b)}}function pick(team,kind){pending={team,kind,sec:cur(),half:st.half};tens=null;$('pt').textContent=names(team)+'：'+(kind==='goal'?'得点者':'対象選手')+'の背番号';drawDigits();$('pick').classList.remove('hidden');}function number(n){if(!pending)return;pending.player=n;st.events.push(pending);pending=null;$('pick').classList.add('hidden');render()}function pickCard(team,color){pick(team,'card');pending.card=color}$('kickA').onclick=()=>{st.kickoff='A';render()};$('kickB').onclick=()=>{st.kickoff='B';render()};$('backdigit').onclick=()=>{tens=null;drawDigits()};$('unk').onclick=()=>number('?');$('start').onclick=()=>{if(!st.running){st.running=true;last=Date.now();render()}};$('pause').onclick=()=>{if(st.running){st.elapsed=cur();st.running=false;render()}};$('next').onclick=()=>{$('pause').click();st.half=st.half===1?2:1;st.elapsed=0;render()};$('ga').onclick=()=>pick('A','goal');$('gb').onclick=()=>pick('B','goal');$('ya').onclick=()=>pickCard('A','yellow');$('yb').onclick=()=>pickCard('B','yellow');$('ra').onclick=()=>pickCard('A','red');$('rb').onclick=()=>pickCard('B','red');$('undo').onclick=()=>{st.events.pop();render()};function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function scorerList(team){let tally={};st.events.filter(e=>e.kind==='goal'&&e.team===team).forEach(e=>{let p=String(e.player);tally[p]=(tally[p]||0)+1});let rows=Object.entries(tally).sort((a,b)=>b[1]-a[1]||(Number(a[0])||999)-(Number(b[0])||999));return rows.length?rows.map(([n,c])=>'<div class="scorerrow"><span>'+(n==='?'?'背番号不明':escapeHtml(n)+'番')+'</span><b>'+c+'ゴール</b></div>').join(''):'<p class="muted">得点なし</p>'}$('finish').onclick=()=>{$('pause').click();let a=st.events.filter(e=>e.kind==='goal'&&e.team==='A').length,b=st.events.filter(e=>e.kind==='goal'&&e.team==='B').length;$('summary').innerHTML='<h2>🏁 試合結果</h2><div class="score">'+escapeHtml(names('A'))+' '+a+' − '+b+' '+escapeHtml(names('B'))+'</div><h3>得点者一覧</h3><div class="summaryteams"><div><h3>'+escapeHtml(names('A'))+'</h3>'+scorerList('A')+'</div><div><h3>'+escapeHtml(names('B'))+'</h3>'+scorerList('B')+'</div></div><p>前半キックオフ：'+(st.kickoff?escapeHtml(names(st.kickoff)):'未選択')+'</p>';$('summary').classList.remove('hidden')};$('new').onclick=()=>{if(confirm('現在の試合をリセットしますか？')){st={elapsed:0,running:false,half:1,events:[],na:'チームA',nb:'チームB',dur:'45',kickoff:null};$('na').value=st.na;$('nb').value=st.nb;$('dur').value=st.dur;$('summary').classList.add('hidden');$('pick').classList.add('hidden');;pending=null;render()}};['na','nb','dur'].forEach(x=>$(x).oninput=render);$('na').value=st.na;$('nb').value=st.nb;$('dur').value=st.dur;if(!$('dur').value)$('dur').value='45';setInterval(()=>{if(st.running)render()},500);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
